name: Build and Release Windows App

on:
  push:
    branches:
      - master
    paths:
      - 'windows/**'
      - '.github/workflows/build-and-sign.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Native C# Client
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /win32manifest:windows\app.manifest /out:windows\campus-connect.exe windows\campus-connect.cs

      - name: Prepare Artifact for SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          Compress-Archive -Path windows\campus-connect.exe -DestinationPath unsigned-app.zip

      - name: Submit Signing Request to SignPath Foundation
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'campus-connect'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'windows-binary'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: 'signed-binaries'

      - name: Extract Signed Binary
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          Expand-Archive -Path signed-binaries\*.zip -DestinationPath windows -Force

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Campus Connect {0}', github.ref_name) || 'Campus Connect (Latest)' }}
          draft: false
          prerelease: false
          files: windows/campus-connect.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
