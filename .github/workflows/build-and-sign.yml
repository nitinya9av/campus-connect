name: Build and Sign Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Native C# Client
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /win32manifest:windows\app.manifest /out:windows\curaj_connect.exe windows\campus-connect.cs

      - name: Prepare Artifact for SignPath
        run: |
          Compress-Archive -Path windows\curaj_connect.exe -DestinationPath unsigned-app.zip

      - name: Submit Signing Request to SignPath Foundation
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'campus-connect'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'windows-binary'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: 'signed-binaries'

      - name: Extract Signed Binary
        run: |
          Expand-Archive -Path signed-binaries\*.zip -DestinationPath windows -Force

      - name: Publish Signed Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Campus Connect ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: windows/curaj_connect.exe
